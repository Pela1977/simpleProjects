[versions]
agp            = "8.7.3"
kotlin         = "2.0.21"
# ksp           = "2.0.21-1.0.28"   # activar en M10
composeBom     = "2024.12.01"
coreKtx        = "1.15.0"
lifecycleRuntime = "2.8.7"
activityCompose  = "1.9.3"
datastorePreferences = "1.1.1"
uiGoogleFonts  = "1.7.6"
materialIcons  = "1.7.6"
# room         = "2.6.1"            # activar en M10
junit          = "4.13.2"
androidxTestExt = "1.2.1"
espresso       = "3.6.1"

[libraries]
core-ktx                  = { group = "androidx.core",            name = "core-ktx",                    version.ref = "coreKtx" }
lifecycle-runtime-ktx     = { group = "androidx.lifecycle",       name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntime" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntime" }
activity-compose          = { group = "androidx.activity",        name = "activity-compose",            version.ref = "activityCompose" }
compose-bom               = { group = "androidx.compose",         name = "compose-bom",                 version.ref = "composeBom" }
ui                        = { group = "androidx.compose.ui",      name = "ui" }
ui-graphics               = { group = "androidx.compose.ui",      name = "ui-graphics" }
ui-tooling                = { group = "androidx.compose.ui",      name = "ui-tooling" }
ui-tooling-preview        = { group = "androidx.compose.ui",      name = "ui-tooling-preview" }
ui-test-junit4            = { group = "androidx.compose.ui",      name = "ui-test-junit4" }
material3                 = { group = "androidx.compose.material3", name = "material3" }
material-icons-core       = { group = "androidx.compose.material", name = "compose-material-icons-core", version.ref = "materialIcons" }
datastore-preferences     = { group = "androidx.datastore",       name = "datastore-preferences",       version.ref = "datastorePreferences" }
ui-google-fonts           = { group = "androidx.compose.ui",      name = "ui-text-google-fonts",         version.ref = "uiGoogleFonts" }
# room-runtime             = { group = "androidx.room", name = "room-runtime", version.ref = "room" }  # M10
# room-ktx                 = { group = "androidx.room", name = "room-ktx",     version.ref = "room" }  # M10
# room-compiler            = { group = "androidx.room", name = "room-compiler", version.ref = "room" } # M10 (ksp)
junit                     = { group = "junit",                    name = "junit",                       version.ref = "junit" }
androidx-test-ext         = { group = "androidx.test.ext",        name = "junit",                       version.ref = "androidxTestExt" }

[plugins]
android-application = { id = "com.android.application",         version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",    version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# ksp                = { id = "com.google.devtools.ksp",         version.ref = "ksp" }  # activar en M10
